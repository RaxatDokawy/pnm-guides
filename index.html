async function unlock(k){
  const raw=Uint8Array.from(atob(PAYLOAD),c=>c.charCodeAt(0));
  const salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey("raw",enc.encode(k),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:100000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct);
  document.getElementById("content").innerHTML=new TextDecoder().decode(plain);
}
function tryUnlock(){
  const k=document.getElementById("k").value.trim();
  unlock(k).then(()=>{sessionStorage.setItem("pnm_key",k);document.getElementById("lock").remove();
    document.getElementById("tools").classList.remove("hidden");bind();})
  .catch(()=>{document.getElementById("err").textContent="Неверный ключ — проверь сообщение от бота";});
}
function bind(){
  document.querySelectorAll(".copy-btn").forEach(b=>{b.textContent="📋 копировать";
    b.addEventListener("click",()=>{const t=b.parentElement.innerText.replace("📋 копировать","").trim();
      navigator.clipboard.writeText(t).then(()=>{b.textContent="✅ скопировано";b.classList.add("ok");
        setTimeout(()=>{b.textContent="📋 копировать";b.classList.remove("ok")},1500);});});});
  document.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{
    document.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));c.classList.add("on");
    const p=c.dataset.part;
    document.querySelectorAll("section.part").forEach(s=>{
      s.classList.toggle("hidden",!(p==="all"||s.dataset.part===p));});}));
  document.getElementById("q").addEventListener("input",e=>{
    const q=e.target.value.toLowerCase();
    document.querySelectorAll(".card,h3,p,li,tr").forEach(el=>{
      if(!el.closest("section"))return;
      el.classList.toggle("hidden",q&&!el.textContent.toLowerCase().includes(q));});});
}
window.addEventListener("DOMContentLoaded",()=>{
  const m=location.hash.match(/k=([A-Z0-9]+)/i);
  if(m){document.getElementById("k").value=m[1];tryUnlock();}
});
</script></body></html>
